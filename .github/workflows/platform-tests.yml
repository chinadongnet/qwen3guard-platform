name: Platform checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi==0.136.3 pydantic==2.13.4 pytest==8.3.5 -r requirements-platform.txt
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for file in app/console/*.js; do node --check "$file" || exit 1; done
