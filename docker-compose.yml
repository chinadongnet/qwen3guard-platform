services:
  qwenguard-server:
    image: vllm/vllm-openai:qwen38-x86_64-cu130
    container_name: qwenguard-server
    restart: unless-stopped
    gpus: all
    entrypoint: ["python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8092"]
    working_dir: /workspace
    ports:
      - "0.0.0.0:8092:8092"
    environment:
      - PORT=8092
      - QWENGUARD_MODEL_ROOT=/models
      - HOST_LAN_IPS=192.168.9.120,192.168.26.187,192.168.1.120,192.168.50.152,192.168.21.6
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/workspace
      - qwenguard_models:/models

volumes:
  qwenguard_models:
    external: true
